<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">ILS localizer front-course modulation dominance</title><desc id="desc">Approach toward runway from bottom. Ninety hertz modulation depth predominates to left, 150 hertz to right, both equal at centerline. Both are present across the guidance region.</desc><rect width="760" height="430" rx="12" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17263b"><text x="24" y="32" font-size="21" font-weight="bold">ILS localizer — difference in depth of modulation</text><text x="24" y="55" font-size="14">Front-course view, looking toward the runway; conceptual, not to scale.</text><path d="M380 168L75 365H685Z" fill="#e8edf3" stroke="#a8b8c8"/><path d="M380 168L75 365H380Z" fill="#d6eaff" stroke="#75a8d6"/><path d="M380 168L380 365H685Z" fill="#ffe7cb" stroke="#dda664"/><rect x="342" y="82" width="76" height="90" fill="#727f90"/><path d="M380 88V166" stroke="white" stroke-width="3" stroke-dasharray="10 6"/><rect x="345" y="73" width="70" height="6" fill="#17263b"/><text x="430" y="80" font-size="12">LOC array beyond runway</text><path d="M380 171V365" stroke="#17263b" stroke-width="2.5" stroke-dasharray="8 5"/><text x="205" y="315" font-size="17" text-anchor="middle" font-weight="bold">90 Hz predominates</text><text x="555" y="315" font-size="17" text-anchor="middle" font-weight="bold">150 Hz predominates</text><rect x="288" y="210" width="184" height="45" rx="6" fill="white" stroke="#17263b"/><text x="380" y="228" font-size="13" text-anchor="middle">Equal modulation depths</text><text x="380" y="245" font-size="13" text-anchor="middle">DDM = 0 on course</text><text x="380" y="393" font-size="14" text-anchor="middle">Both tones contribute to the received guidance signal.</text><text x="380" y="413" font-size="13" text-anchor="middle">Receiver measures modulation-depth difference, not separate tone presence.</text></g></svg>