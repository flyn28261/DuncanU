<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">ARINC 429 nominal differential bipolar return-to-zero waveform</title><desc id="desc">Four bits one zero one zero. The active voltage is plus or minus ten volts for the first half of each bit, returning to zero for the second half.</desc><rect width="760" height="300" rx="12" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17263b"><text x="24" y="34" font-size="20" font-weight="bold">ARINC 429 — nominal differential waveform</text><text x="24" y="56" font-size="13">Idealized transmitter signal, A relative to B; not a test tolerance.</text><g stroke="#c4cdd8" stroke-dasharray="5 5"><path d="M100 100H700 M100 160H700 M100 220H700"/><path d="M100 80V235 M250 80V235 M400 80V235 M550 80V235 M700 80V235"/></g><g font-size="14" text-anchor="end"><text x="90" y="104">+10 V</text><text x="90" y="164">0 V</text><text x="90" y="224">−10 V</text></g><path d="M100 160V100H175V160H250V220H325V160H400V100H475V160H550V220H625V160H700" stroke="#1968ae" stroke-width="3.5" fill="none"/><g font-size="18" font-weight="bold" text-anchor="middle"><text x="175" y="91">1</text><text x="325" y="91">0</text><text x="475" y="91">1</text><text x="625" y="91">0</text></g><path d="M100 246V256H250V246" fill="none" stroke="#17263b"/><text x="175" y="277" font-size="13" text-anchor="middle">One bit period</text><text x="480" y="277" font-size="13" text-anchor="middle">Null during second half of each bit</text></g></svg>